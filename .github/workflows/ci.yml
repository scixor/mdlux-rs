name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --locked

      - name: Smoke test C library
        run: |
          cargo build --locked
          cc -std=c11 -Wall -Wextra -Werror examples/capi.c -I include target/debug/libmdlux.a -lm -lpthread -ldl -o target/debug/mdlux-capi-smoke
          target/debug/mdlux-capi-smoke > /dev/null

      - name: Setup Zig for musl cross compilation
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Configure musl cross compiler
        run: |
          mkdir -p "$RUNNER_TEMP/musl-tools"
          cat > "$RUNNER_TEMP/musl-tools/x86_64-linux-musl-gcc" <<'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            [[ "$arg" == --target=* ]] || args+=("$arg")
          done
          exec zig cc -target x86_64-linux-musl "${args[@]}"
          EOF
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$RUNNER_TEMP/musl-tools/x86_64-linux-musl-ar"
          chmod +x "$RUNNER_TEMP/musl-tools/"*
          echo "$RUNNER_TEMP/musl-tools" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$RUNNER_TEMP/musl-tools/x86_64-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C link-self-contained=no" >> "$GITHUB_ENV"

      - name: Build static Linux artifact
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify static CLI and C library
        run: |
          file target/x86_64-unknown-linux-musl/release/mdlux
          file target/x86_64-unknown-linux-musl/release/mdlux | grep -qi "static"
          file target/x86_64-unknown-linux-musl/release/libmdlux.a
