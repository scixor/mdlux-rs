name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static_expected: true
          - os: macos-latest
            target: aarch64-apple-darwin
            static_expected: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Zig for musl C linking
        if: matrix.static_expected
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Configure musl cross compiler
        if: matrix.static_expected
        run: |
          mkdir -p "$RUNNER_TEMP/musl-tools"
          cat > "$RUNNER_TEMP/musl-tools/x86_64-linux-musl-gcc" <<'EOF'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            [[ "$arg" == --target=* ]] || args+=("$arg")
          done
          exec zig cc -target x86_64-linux-musl "${args[@]}"
          EOF
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$RUNNER_TEMP/musl-tools/x86_64-linux-musl-ar"
          chmod +x "$RUNNER_TEMP/musl-tools/"*
          echo "$RUNNER_TEMP/musl-tools" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$RUNNER_TEMP/musl-tools/x86_64-linux-musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C link-self-contained=no" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux static binary
        if: matrix.static_expected
        run: |
          file target/${{ matrix.target }}/release/mdlux
          file target/${{ matrix.target }}/release/mdlux | grep -qi "static"

      - name: Package CLI
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/mdlux-${{ matrix.target }}.tar.gz mdlux

      - name: Package C library
        run: |
          mkdir -p dist/mdlux-c-${{ matrix.target }}/include dist/mdlux-c-${{ matrix.target }}/examples dist/mdlux-c-${{ matrix.target }}/cmake
          cp target/${{ matrix.target }}/release/libmdlux.a dist/mdlux-c-${{ matrix.target }}/
          cp -R include/. dist/mdlux-c-${{ matrix.target }}/include/
          cp examples/capi.c dist/mdlux-c-${{ matrix.target }}/examples/
          cp cmake/mdluxConfig.cmake dist/mdlux-c-${{ matrix.target }}/cmake/
          cp README.md dist/mdlux-c-${{ matrix.target }}/
          tar -C dist/mdlux-c-${{ matrix.target }} -czf dist/mdlux-c-${{ matrix.target }}.tar.gz .

      - name: Smoke test C package on Linux
        if: matrix.static_expected
        run: |
          mkdir -p dist/c-smoke
          tar -C dist/c-smoke -xzf dist/mdlux-c-${{ matrix.target }}.tar.gz
          zig cc -target x86_64-linux-musl dist/c-smoke/examples/capi.c -I dist/c-smoke/include dist/c-smoke/libmdlux.a -lm -lpthread -ldl -lunwind -o dist/c-smoke/capi
          dist/c-smoke/capi > /dev/null

      - name: Smoke test C package on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/c-smoke
          tar -C dist/c-smoke -xzf dist/mdlux-c-${{ matrix.target }}.tar.gz
          cc dist/c-smoke/examples/capi.c -I dist/c-smoke/include dist/c-smoke/libmdlux.a -framework Security -framework CoreFoundation -o dist/c-smoke/capi
          dist/c-smoke/capi > /dev/null

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdlux-${{ matrix.target }}
          path: dist/mdlux-${{ matrix.target }}.tar.gz

      - name: Upload C library artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdlux-c-${{ matrix.target }}
          path: dist/mdlux-c-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: dist/*.tar.gz
