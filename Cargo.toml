[package]
name = "mdlux"
version = "0.0.3"
edition = "2024"
description = "Terminal-first Markdown renderer with ANSI and Kitty enhancements"
license = "MIT"
repository = "https://github.com/scixor/mdlux-rs"
readme = "README.md"
keywords = ["markdown", "terminal", "cli", "ansi", "kitty"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
terminal_size = "0.4"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
